<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>BroTerminal | Bro Network</title>

<link
    rel="stylesheet"
    href="style.css"
>

<link
    rel="stylesheet"
    href="broterminal.css"
>

</head>

<body>

<div class="app broterminal-app">

<!-- HEADER -->

<header>

    <div class="brand">

        <div class="logo-dot"></div>

        <img
            src="logo.svg"
            alt="Bro Network"
            class="brand-logo"
        >

    </div>


    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="lchat.html">
            Local Chat
        </a>

        <a href="brodiscover.html">
            Discover
        </a>

    </nav>


    <button
        class="user-id"
        type="button"
    >
        ID
    </button>

</header>


<!-- MAIN -->

<main class="broterminal-main">

    <section class="broterminal-title">

        <p class="eyebrow">
            LOCAL TERMINAL
        </p>

        <h1>
            BroTerminal
        </h1>

        <p>
            Your online terminal is here
        </p>

    </section>

<!-- TERMINAL -->

<section class="terminal">

    <div class="terminal-output"></div>

    <div class="terminal-input-row"></div>

</section>
<script src="broterminal.js"></script>

<!-- FOOTER -->

<footer>

    <span>
        BRO NETWORK
    </span>

    <span>
        NO INTERNET REQUIRED
    </span>

</footer>

</div>

</html>
